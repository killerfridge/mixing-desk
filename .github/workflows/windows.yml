name: Windows x64 development build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Collect startup diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/startup-diagnostics | Out-Null
          Copy-Item "$env:LOCALAPPDATA/Mixing Desk/Logs/*" build/startup-diagnostics -ErrorAction SilentlyContinue
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MixingDesk-startup-diagnostics
          path: build/startup-diagnostics/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MixingDesk-windows-x64-development
          path: build/windows-release/*.zip
          if-no-files-found: error
